name: "praxis-env"
version: "1.0.0"
description: "Production Incident Response Training Ground — simulating real-world SRE on-call triage for AI agents. Agents investigate alerts, query logs and metrics, diagnose root causes across service dependency graphs, and execute remediations. Six tasks spanning easy, medium, and hard difficulty expose genuine gaps in frontier model reasoning."
supports_concurrent_sessions: true
themes:
  - long-horizon-planning
tasks:
  - name: single-service-alert
    difficulty: easy
    max_steps: 15
  - name: ambiguous-incident
    difficulty: medium
    max_steps: 25
  - name: cascading-failure
    difficulty: hard
    max_steps: 20
  - name: memory-leak
    difficulty: hard
    max_steps: 25
  - name: cascading-platform-failure
    difficulty: hard
    max_steps: 150
  - name: procedural-incident
    difficulty: medium
    max_steps: 25
action:
  type: text
  field: command
observation:
  fields:
    [
      alert_summary,
      system_status,
      investigation_result,
      available_commands,
      time_elapsed_minutes,
      severity,
      services_affected,
      step_number,
      mission_id,
      phase,
      time_budget,
      pending_objectives,
    ]
data_sources:
  # MissionScenario surfaces these vendored fixtures via ArtifactStore
  # (Issue #38, ADR-17). Provenance prefix and license are documented
  # at the canonical paths below.
  - name: praxis-mission-fixtures
    kind: internal
    root: data/artifacts
    notice: data/artifacts/NOTICE.md
    provenance_prefix: "praxis:fixtures"
    license_file: LICENSE-3rd-party
