name: CI

# Mirrors the OpenEnv reference workflow (`OpenEnv/.github/workflows/test.yml`)
# patterns:
#   - astral-sh/setup-uv@v7 with a pinned uv version
#   - 3.11 + 3.12 Python matrix
#   - lint job (ruff) + test job (pytest) + openenv-validate job
#   - dependabot-friendly checkout/setup actions
#
# This workflow is the required status check for the `main` branch protection
# rule (see scripts/setup_branch_protection.sh). All three jobs must pass
# before any PR can merge.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  UV_VERSION: "0.9.17"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Install lint tools
        run: uv pip install ruff

      - name: Run ruff format check
        run: uv run ruff format --check praxis_env/ server/ tests/ inference.py

      - name: Run ruff lint
        run: uv run ruff check praxis_env/ server/ tests/ inference.py

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: |
          uv run pytest tests/ \
            --tb=short \
            -q

  openenv-validate:
    name: openenv validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Validate OpenEnv manifest + spec
        run: uv run openenv validate

  http-smoke:
    # Live HTTP smoke test against the FastAPI server. Boots uvicorn,
    # hits /health + /reset for all four shipping tasks + memory-leak,
    # asserts 200 + that JSON parses. Catches concurrency/imports/regression
    # bugs that pytest can miss when it stubs out the HTTP layer.
    name: HTTP smoke (uvicorn /health + /reset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Start server
        run: |
          uv run python -m uvicorn server.app:app --host 127.0.0.1 --port 7860 \
            > server.log 2>&1 &
          echo "PID=$!" >> "$GITHUB_ENV"
          # Wait up to 30s for /health 200
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:7860/health >/dev/null 2>&1; then
              echo "server up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Probe /health and /tasks
        run: |
          curl -fsS http://127.0.0.1:7860/health  | tee /tmp/health.json
          curl -fsS http://127.0.0.1:7860/tasks   | tee /tmp/tasks.json

      - name: /reset every shipping task
        run: |
          set -euo pipefail
          for task in single-service-alert ambiguous-incident cascading-failure memory-leak; do
            echo "==> $task"
            curl -fsS -X POST http://127.0.0.1:7860/reset \
              -H "Content-Type: application/json" \
              -d "{\"task_name\":\"$task\"}" \
              | python -c "import sys,json; d=json.load(sys.stdin); assert d['step_number']==0, d; print('OK')"
          done

      - name: Tail server log on failure
        if: failure()
        run: tail -n 200 server.log || true

      - name: Stop server
        if: always()
        run: |
          if [ -n "${PID:-}" ]; then kill "$PID" 2>/dev/null || true; fi
